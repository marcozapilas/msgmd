<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>msgmd — Outlook .msg to Markdown</title>
    <meta
      name="description"
      content="Convert Outlook .msg files into clean Markdown, privately in your browser."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4f8f7"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1a1b"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Set the theme before first paint: stored choice wins, else follow the
      // system preference.
      (function () {
        try {
          var stored = localStorage.getItem("msgmd-theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark"
              ? stored
              : dark
                ? "dark"
                : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
