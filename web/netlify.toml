# Netlify config for the msgmd web app.
# Set "Base directory" to `web` in the Netlify UI, or deploy from repo root with
# these settings. VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY must be added as
# environment variables in Netlify (Site settings → Environment variables).
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routing/refresh works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
